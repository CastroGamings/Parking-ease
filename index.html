<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Search with Voice & Postcode Fix</title>

  <!-- Mapbox GL JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b131e;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* Floating Top Bar */
    .search-container {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 450px;
      display: flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 6px 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 10;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 16px;
      padding: 8px 14px;
    }

    .search-input::placeholder {
      color: #94a3b8;
    }

    .icon-btn {
      background: #1d4ed8;
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 6px;
      transition: background 0.2s ease;
    }

    .icon-btn:hover {
      background: #2563eb;
    }

    .mic-btn {
      background: #334155;
    }

    .mic-btn:hover {
      background: #475569;
    }

    .mic-btn.listening {
      background: #ef4444;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    /* Status Banner */
    #status-msg {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(239, 68, 68, 0.9);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      display: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- Search UI -->
  <div class="search-container">
    <input type="text" id="search-input" class="search-input" placeholder="Enter postcode (e.g. CT16 2QZ)..." />
    
    <!-- Voice Recognition Button -->
    <button id="mic-btn" class="icon-btn mic-btn" title="Voice Search">
      <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </button>

    <!-- Search Button -->
    <button id="search-btn" class="icon-btn" title="Search">
      <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
    </button>
  </div>

  <div id="status-msg"></div>
  <div id="map"></div>

  <script>
    // Replace with your Mapbox Public Token if needed
    mapboxgl.accessToken = 'pk.eyJ1IjoibWFwYm94IiwiYSI6ImNpejY4M29iazA2Z2gycXA4N2pmbDZmangifQ.-g_vE53SD2WrJ6tFX7QHmA';

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/dark-v11',
      center: [1.3134, 51.1279], // Default to Dover area (CT16)
      zoom: 13
    });

    let currentMarker = null;

    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');
    const micBtn = document.getElementById('mic-btn');
    const statusMsg = document.getElementById('status-msg');

    // Display temporary user notification messages
    function showStatus(text, isError = true) {
      statusMsg.textContent = text;
      statusMsg.style.background = isError ? 'rgba(239, 68, 68, 0.9)' : 'rgba(34, 197, 94, 0.9)';
      statusMsg.style.display = 'block';
      setTimeout(() => statusMsg.style.display = 'none', 4000);
    }

    // Format raw postcode (e.g. "ct162qz" -> "CT16 2QZ")
    function formatUKPostcode(postcode) {
      const cleaned = postcode.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
      if (cleaned.length >= 5) {
        return cleaned.slice(0, -3) + ' ' + cleaned.slice(-3);
      }
      return cleaned;
    }

    // Geocode Postcode via postcodes.io API
    async function searchPostcode(query) {
      if (!query.trim()) return;

      const formatted = formatUKPostcode(query);
      searchInput.value = formatted;

      try {
        const response = await fetch(`https://api.postcodes.io/postcodes/${encodeURIComponent(formatted)}`);
        const data = await response.json();

        if (data.status === 200 && data.result) {
          const { longitude, latitude } = data.result;

          // Pan Map
          map.flyTo({
            center: [longitude, latitude],
            zoom: 16,
            essential: true
          });

          // Update Marker
          if (currentMarker) currentMarker.remove();
          currentMarker = new mapboxgl.Marker({ color: '#22c55e' })
            .setLngLat([longitude, latitude])
            .setPopup(new mapboxgl.Popup().setHTML(`<b>${data.result.postcode}</b><br>${data.result.admin_district}`))
            .addTo(map);

        } else {
          showStatus('Postcode not found. Please check spelling.');
        }
      } catch (err) {
        showStatus('Error searching postcode. Try again.');
      }
    }

    // Event Listeners for Search
    searchBtn.addEventListener('click', () => searchPostcode(searchInput.value));
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchPostcode(searchInput.value);
    });

    // Voice Recognition Setup
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-GB';
      recognition.interimResults = false;

      micBtn.addEventListener('click', () => {
        recognition.start();
        micBtn.classList.add('listening');
      });

      recognition.onresult = (event) => {
        micBtn.classList.remove('listening');
        const spokenText = event.results[0][0].transcript;
        searchInput.value = spokenText;
        searchPostcode(spokenText);
      };

      recognition.onerror = () => {
        micBtn.classList.remove('listening');
        showStatus('Voice recognition failed. Try speaking again.');
      };

      recognition.onend = () => {
        micBtn.classList.remove('listening');
      };
    } else {
      micBtn.addEventListener('click', () => {
        showStatus('Voice recognition is not supported in this web browser.');
      });
    }
  </script>
</body>
</html>
